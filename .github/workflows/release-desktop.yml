name: Release desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-nvidia:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements/app-py310.txt
            requirements/desktop-build.txt
            requirements/test.txt
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements\app-py310.txt -r requirements\desktop-build.txt -r requirements\test.txt
      - name: Install and test frontend
        run: |
          npm ci
          npm run build
          npm run test:unit
          npx playwright install chromium
          npm run test:e2e
      - name: Use the tag as the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          npm version $version --no-git-tag-version --allow-same-version
      - name: Build optional Windows score extraction pack
        shell: pwsh
        run: |
          .venv\Scripts\python.exe -m pip uninstall --yes opencv-python
          .venv\Scripts\python.exe -m pip install "opencv-python-headless<4.11"
          $version = (Get-Content package.json | ConvertFrom-Json).version
          .venv\Scripts\python.exe scripts\build_score_feature_pack.py "desktop\dist\installer\PracticeLab-Score-Windows-$version.zip"
      - name: Collect Node and FFmpeg
        shell: pwsh
        run: |
          npm run desktop:prepare
          "${{ github.workspace }}\desktop\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Test backend
        run: .venv\Scripts\python.exe -m pytest -q
      - name: Build bundled backend
        run: npm run desktop:backend
      - name: Verify bundled backend runtime
        shell: pwsh
        run: |
          if (-not (Test-Path "desktop\dist\backend\practice-lab-backend\python3.dll")) {
            throw "Stable Python ABI DLL is not bundled"
          }
          desktop\dist\backend\practice-lab-backend\practice-lab-backend.exe --check-runtime windows
      - name: Enable Windows media runtime for OpenCV validation
        shell: powershell
        run: |
          if ((Get-WindowsFeature Server-Media-Foundation).InstallState -ne 'Installed') {
            $result = Install-WindowsFeature Server-Media-Foundation
            if (-not $result.Success) { throw "Failed to enable Windows Media Foundation" }
          }
      - name: Verify the optional Windows score pack
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $featureHome = Join-Path $env:RUNNER_TEMP "practice-lab-score-test"
          $featureDir = Join-Path $featureHome "runtime\score\abi-1"
          New-Item -ItemType Directory -Force -Path $featureDir | Out-Null
          Expand-Archive "desktop\dist\installer\PracticeLab-Score-Windows-$version.zip" -DestinationPath $featureDir
          $env:PRACTICE_LAB_HOME = $featureHome
          $env:PRACTICE_LAB_VERSION = $version
          desktop\dist\backend\practice-lab-backend\practice-lab-backend.exe --check-runtime score
      - name: Install optional Windows CPU analysis dependencies
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstallPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsInstallPath) { throw "Visual Studio C++ build tools are unavailable" }
          Import-Module (Join-Path $vsInstallPath "Common7\Tools\Microsoft.VisualStudio.DevShell.dll")
          Enter-VsDevShell -VsInstallPath $vsInstallPath -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"
          $env:CC = "cl.exe"
          $env:CXX = "cl.exe"

          .venv\Scripts\python.exe -m pip install "torch==2.6.0" "torchaudio==2.6.0" --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { throw "Failed to install CPU PyTorch" }

          # NATTEN 0.17.5 derives the Python import-library directory from
          # sys.executable and therefore looks under Scripts\libs in a venv.
          $pythonBase = .venv\Scripts\python.exe -c "import sys; print(sys.base_prefix)"
          $pythonImportLibrary = Join-Path $pythonBase "libs\python310.lib"
          $nattenImportLibraryDir = ".venv\Scripts\libs"
          if (-not (Test-Path $pythonImportLibrary)) { throw "Python import library is unavailable" }
          New-Item -ItemType Directory -Force -Path $nattenImportLibraryDir | Out-Null
          Copy-Item -Force $pythonImportLibrary (Join-Path $nattenImportLibraryDir "python310.lib")

          .venv\Scripts\python.exe -m pip install "natten==0.17.5" --no-build-isolation
          if ($LASTEXITCODE -ne 0) { throw "Failed to build CPU NATTEN with MSVC" }
          .venv\Scripts\python.exe -m pip install "https://github.com/openmirlab/all-in-one-fix/archive/9ba8cac49d441f54e2d89aaefbd44acde8ee2c38.zip" --no-build-isolation
          if ($LASTEXITCODE -ne 0) { throw "Failed to install the CPU analyzer" }
          .venv\Scripts\python.exe scripts\patch_natten_cpu.py
          if ($LASTEXITCODE -ne 0) { throw "Failed to apply the CPU compatibility patch" }
      - name: Build optional Windows CPU analysis pack
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build_desktop_cpu_runtime.ps1
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $archive = "desktop\dist\installer\PracticeLab-Windows-CPU-$version.zip"
          Compress-Archive -Path desktop\dist\features\practice-lab-cpu-runtime -DestinationPath $archive -CompressionLevel Optimal
      - name: Build tagged installer
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: npm run desktop:dist -- --publish=never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Build installer without publishing
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run desktop:dist -- --publish=never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify Electron provides the JavaScript runtime
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = "1"
          # PracticeLab.exe is a GUI-subsystem executable, so a direct PowerShell
          # invocation can return before the process and its output are complete.
          $process = Start-Process `
            -FilePath "desktop\dist\installer\win-unpacked\PracticeLab.exe" `
            -ArgumentList "-e", "process.exit(process.versions.node?0:1)" `
            -NoNewWindow `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) { throw "Electron Node runtime is unavailable" }
      - name: Verify the Windows installer signature status
        shell: pwsh
        run: |
          $installer = Get-Item desktop/dist/installer/PracticeLab-Setup-*.exe
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'NotSigned') { throw "Expected an unsigned installer, got $($signature.Status)" }
      - name: Generate dependency inventories
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          npm sbom --sbom-format cyclonedx | Set-Content -Encoding utf8 desktop/dist/installer/PracticeLab-node-sbom-windows.cdx.json
          .venv\Scripts\python.exe -m pip inspect | Set-Content -Encoding utf8 desktop/dist/installer/PracticeLab-python-dependencies-windows.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PracticeLab-Windows
          path: |
            desktop/dist/installer/*.exe
            desktop/dist/installer/*.yml
            desktop/dist/installer/*.blockmap
            desktop/dist/installer/*Windows-CPU-*.zip
            desktop/dist/installer/*Score-Windows-*.zip
            desktop/dist/installer/*sbom*.json
            desktop/dist/installer/*dependencies*.json

  macos-apple-silicon:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements/app.txt
            requirements/desktop-build.txt
            requirements/test.txt
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
      - name: Install application and analysis dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements/app.txt -r requirements/desktop-build.txt -r requirements/test.txt
          .venv/bin/python -m pip install "torch==2.6.0"
          .venv/bin/python -m pip install "natten==0.17.5" --no-build-isolation
          .venv/bin/python -m pip install "https://github.com/openmirlab/all-in-one-fix/archive/9ba8cac49d441f54e2d89aaefbd44acde8ee2c38.zip" --no-build-isolation
          .venv/bin/python scripts/patch_natten_cpu.py
      - name: Install and test frontend
        run: |
          npm ci
          npm run build
          npm run test:unit
      - name: Prepare bundled tools
        run: |
          npm run desktop:prepare:mac
          echo "$GITHUB_WORKSPACE/desktop/bin" >> "$GITHUB_PATH"
      - name: Test backend
        run: .venv/bin/python -m pytest -q
      - name: Verify Apple Silicon runtime
        run: |
          test "$(uname -m)" = "arm64"
          .venv/bin/python -c "import allin1fix, demucs_infer, natten, torch; assert torch.backends.mps.is_built(); assert not torch.cuda.is_available()"
      - name: Use the tag as the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Build optional Apple Silicon score extraction pack
        run: |
          version="$(node -p 'require("./package.json").version')"
          .venv/bin/python scripts/build_score_feature_pack.py "desktop/dist/installer/PracticeLab-Score-macOS-arm64-$version.zip"
      - name: Prepare bundled tools and backend
        run: npm run desktop:backend:mac
      - name: Verify bundled Mac analysis runtime
        run: |
          backend="desktop/dist/backend/practice-lab-backend/practice-lab-backend"
          "$backend" --check-runtime macos-analysis
          "$backend" scripts/analyze_audio.py --help
          "$backend" scripts/split_stems.py --help
      - name: Verify the optional Apple Silicon score pack
        run: |
          version="$(node -p 'require("./package.json").version')"
          feature_home="$(mktemp -d)"
          feature_dir="$feature_home/runtime/score/abi-1"
          mkdir -p "$feature_dir"
          unzip -q "desktop/dist/installer/PracticeLab-Score-macOS-arm64-$version.zip" -d "$feature_dir"
          PRACTICE_LAB_HOME="$feature_home" PRACTICE_LAB_VERSION="$version" \
            desktop/dist/backend/practice-lab-backend/practice-lab-backend --check-runtime score
      - name: Build tagged ad-hoc signed DMG
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run desktop:dist:mac -- --publish=never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Build ad-hoc signed test DMG
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run desktop:dist:mac -- --publish=never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify packaged Mac backend startup
        run: |
          app="desktop/dist/installer/mac-arm64/PracticeLab.app"
          backend="$app/Contents/Resources/backend/practice-lab-backend"
          internal="$app/Contents/Resources/backend/_internal"
          ssl_module="$(find "$internal/lib-dynload" -maxdepth 1 -name '_ssl*.so' -print -quit)"
          hashlib_module="$(find "$internal/lib-dynload" -maxdepth 1 -name '_hashlib*.so' -print -quit)"
          otool -L "$ssl_module" | grep -F '@loader_path/../libssl.3.dylib'
          otool -L "$ssl_module" | grep -F '@loader_path/../libcrypto.3.dylib'
          otool -L "$hashlib_module" | grep -F '@loader_path/../libcrypto.3.dylib'
          otool -L "$internal/libssl.3.dylib" | grep -F '@loader_path/libcrypto.3.dylib'
          codesign --verify --strict "$internal/libcrypto.3.dylib"
          codesign --verify --strict "$internal/libssl.3.dylib"
          codesign --verify --strict "$ssl_module"
          codesign --verify --strict "$hashlib_module"
          app_home="$(mktemp -d)"
          log_file="$(mktemp)"
          port=48765
          PRACTICE_LAB_HOME="$app_home" \
          PRACTICE_LAB_RESOURCE_DIR="$app/Contents/Resources/app" \
          PRACTICE_LAB_SKIP_ENV_FILE=1 \
          PRACTICE_LAB_PORT="$port" \
          "$backend" >"$log_file" 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true; wait "$backend_pid" 2>/dev/null || true; rm -rf "$app_home" "$log_file"' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent "http://127.0.0.1:$port/healthz" >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$backend_pid" 2>/dev/null; then
              cat "$log_file" >&2
              exit 1
            fi
            sleep 1
          done
          cat "$log_file" >&2
          exit 1
      - name: Verify Electron provides the JavaScript runtime
        run: |
          app="desktop/dist/installer/mac-arm64/PracticeLab.app"
          node_version="$(ELECTRON_RUN_AS_NODE=1 "$app/Contents/MacOS/PracticeLab" -p 'process.versions.node')"
          test -n "$node_version"
      - name: Verify the Mac application bundle integrity
        run: |
          dmg="$(find desktop/dist/installer -maxdepth 1 -name 'PracticeLab-*-arm64.dmg' -print -quit)"
          test -n "$dmg"
          codesign --display --verbose=4 desktop/dist/installer/mac-arm64/PracticeLab.app
          codesign --verify --deep --strict --verbose=2 desktop/dist/installer/mac-arm64/PracticeLab.app
          if spctl --assess --type execute desktop/dist/installer/mac-arm64/PracticeLab.app 2>/dev/null; then
            echo "Expected an ad-hoc signed, non-notarized build to remain untrusted by Gatekeeper" >&2
            exit 1
          fi
      - name: Generate dependency inventories
        run: |
          npm sbom --sbom-format cyclonedx > desktop/dist/installer/PracticeLab-node-sbom-macos.cdx.json
          .venv/bin/python -m pip inspect > desktop/dist/installer/PracticeLab-python-dependencies-macos.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PracticeLab-macOS-Apple-Silicon
          path: |
            desktop/dist/installer/*.dmg
            desktop/dist/installer/*Score-macOS-arm64-*.zip

  release-metadata:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows-nvidia, macos-apple-silicon]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: PracticeLab-*
          path: release-artifacts
          merge-multiple: true
      - name: Create SHA-256 checksums
        working-directory: release-artifacts
        run: |
          sha256sum \
            PracticeLab-Setup-*.exe \
            PracticeLab-*-arm64.dmg \
            PracticeLab-Windows-CPU-*.zip \
            PracticeLab-Score-*.zip \
            > PracticeLab-SHA256SUMS.txt
      - name: Upload installers and publish the completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "PracticeLab $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$GITHUB_REF_NAME" \
            release-artifacts/PracticeLab-Setup-*.exe \
            release-artifacts/PracticeLab-Setup-*.exe.blockmap \
            release-artifacts/latest.yml \
            release-artifacts/PracticeLab-*-arm64.dmg \
            release-artifacts/PracticeLab-Windows-CPU-*.zip \
            release-artifacts/PracticeLab-Score-*.zip \
            release-artifacts/PracticeLab-SHA256SUMS.txt \
            --clobber
          gh release edit "$GITHUB_REF_NAME" --title "PracticeLab $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --draft=false --latest
